<div class="mb-5">
<h1 class="text 2x1 text-secondary">Lista de usuarios</h1>
</div>
<div class="divider.divider-secondary"></div>
@if (userResource.isLoading()) {
  <div class="flex justify-center items-center h-screen">
    <p class="loading loading-spinner loading-lg">Cargando usuarios...</p>
  </div>
}
@if (userResource.hasValue()) {
<user-table [users]="userResource.value().data.users"></user-table>
} @else {
    <div class="flex justify-center items-center h-screen">
        <h2 class="text-2x1">ELista no tiene datos para mostrar</h2>
    </div>

}
