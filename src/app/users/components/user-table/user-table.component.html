<div class="overflow-x-auto rounded-box border border-base-content/5">
  <table class="table">
    <!-- head -->
    <thead>
      <tr>
        <th>#</th>
        <th>FullName</th>
        <th>Email</th>
        <th>Telephone</th>
        <th>Options</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id; let i = $index) {
      <!-- row 1 -->
      <tr>
        <th>{{i+1}}</th>
        <td>
          <div class="flex items-center gap-3">
            <div class="avatar">
              <div class="mask mask-squircle h-12 w-12">
                <img
                  src="'http://localhost:3000/api/users/avatar/'{{user.id}}" 
                  alt="Avatar Tailwind CSS Component" />
              </div>
            </div>
            <div>
              <div class="font-bold">{{user.first_name}} {{user.last_name}}</div>
            </div>
          </div>
        </td>
        <td>
          <span class="badge badge-ghost badge-sm">{{user.email}}</span>
        </td>
        <td>
          <span class="badge badge-ghost badge-sm">{{user.Telephone}}</span>
        </td>
        <th>
          <button class="btn btn-ghost btn-xs">delete</button>
          <button class="btn btn-ghost btn-xs">edit</button>
        </th>
      </tr>
    }
    </tbody>
    <!-- foot -->
  </table>
</div>
